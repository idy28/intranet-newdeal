name: CD Pipeline - Deploiement Production

on:
  push:
    branches:
      - prod

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ════════════════════════════════════════════════
  # JOB 1 : SCAN SECURITE AVANT DEPLOIEMENT
  # ════════════════════════════════════════════════
  security-check:
    name: Scan Securite Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull image depuis Docker Hub
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Scan vulnerabilites avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

  # ════════════════════════════════════════════════
  # JOB 2 : DEPLOIEMENT EN PRODUCTION
  # ════════════════════════════════════════════════
  deploy:
    name: Deploiement Production - Port 80
    runs-on: ubuntu-latest
    needs: security-check

    steps:
      - name: Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Arreter l ancien conteneur si existant
        run: |
          docker stop intranet-newdeal 2>/dev/null || true
          docker rm intranet-newdeal 2>/dev/null || true

      - name: Pull derniere image
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Demarrer le conteneur sur le port 8080
        run: |
          docker run -d \
            --name intranet-newdeal \
            --restart always \
            -p 8080:80 \
            ${{ env.IMAGE_NAME }}:latest

      - name: Attendre le demarrage
        run: sleep 5

      - name: Verifier que le site est accessible
        run: |
          curl -f http://localhost:8080 || exit 1
          echo "Site accessible avec succes"

      - name: Afficher les conteneurs actifs
        run: docker ps --filter name=intranet-newdeal
