name: 🔧 CI Évolué - New Deal Technologique

on:
  push:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:
  build:
    name: 🐳 Build Image Slim
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      # ⚡ IMAGE MODIFIÉE : nginx:alpine3.23-slim
      - name: 🔨 Build avec nginx:alpine3.23-slim
        run: |
          sed -i 's|FROM nginx:alpine3.23|FROM nginx:alpine3.23-slim|g' Dockerfile
          docker build -t ${{ env.IMAGE_NAME }}:slim .

      - name: 💾 Sauvegarder l'image
        run: docker save ${{ env.IMAGE_NAME }}:slim -o intranet-slim.tar

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-slim
          path: intranet-slim.tar

  security-scan:
    name: 🔒 Scan + Blocage si CRITICAL
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim

      - name: 🔄 Charger l'image
        run: docker load -i intranet-slim.tar

      # 🚨 BLOQUE si vulnérabilité CRITICAL détectée
      - name: 🛡️ Scan Trivy - BLOQUE si CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:slim
          format: table
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: false

      - name: 🔍 Scan secrets Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push:
    name: 🚀 Push Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-slim

      - name: 🔄 Charger l'image
        run: docker load -i intranet-slim.tar

      - name: 🔐 Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📤 Push image slim
        run: docker push ${{ env.IMAGE_NAME }}:slim

  # ══════════════════════════════════════════
  # NOTIFICATION EMAIL (succès ou échec)
  # ══════════════════════════════════════════
  notify:
    name: 📧 Notification Email
    runs-on: ubuntu-latest
    needs: [build, security-scan, push]
    if: always()

    steps:
      - name: 📧 Email de succès
        if: ${{ needs.push.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ [New Deal] Pipeline CI réussi - ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD New Deal Technologique"
          body: |
            ✅ Le pipeline CI s'est exécuté avec succès !

            📁 Repository : ${{ github.repository }}
            🌿 Branche    : ${{ github.ref_name }}
            👤 Auteur     : ${{ github.actor }}
            🔗 Commit     : ${{ github.sha }}

            L'image Docker a été publiée sur Docker Hub.

      - name: 📧 Email d'échec
        if: ${{ needs.push.result != 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [New Deal] Pipeline CI ÉCHOUÉ - ${{ github.ref_name }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "CI/CD New Deal Technologique"
          body: |
            ❌ Le pipeline CI a échoué !

            📁 Repository : ${{ github.repository }}
            🌿 Branche    : ${{ github.ref_name }}
            👤 Auteur     : ${{ github.actor }}
            🔗 Commit     : ${{ github.sha }}

            Veuillez vérifier les logs GitHub Actions.
