name: 🔧 CI Pipeline - New Deal Technologique

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:
  # ══════════════════════════════════════════
  # JOB 1 : BUILD IMAGE DOCKER
  # ══════════════════════════════════════════
  build:
    name: 🐳 Build Image Docker
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 🔨 Build de l'image Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest \
                       -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: 💾 Sauvegarder l'image
        run: |
          docker save ${{ env.IMAGE_NAME }}:latest -o intranet-newdeal.tar

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: intranet-newdeal.tar
          retention-days: 1

  # ══════════════════════════════════════════
  # JOB 2 : SCAN SÉCURITÉ
  # ══════════════════════════════════════════
  security-scan:
    name: 🔒 Scan Sécurité
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: 🔄 Charger l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: 🛡️ Scan vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true

      - name: 🔍 Scan secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ══════════════════════════════════════════
  # JOB 3 : PUSH VERS DOCKER HUB
  # ══════════════════════════════════════════
  push:
    name: 🚀 Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: 🔄 Charger l'image Docker
        run: docker load -i intranet-newdeal.tar

      - name: 🔐 Connexion Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📤 Push vers Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          docker tag ${{ env.IMAGE_NAME }}:latest \
                     ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
